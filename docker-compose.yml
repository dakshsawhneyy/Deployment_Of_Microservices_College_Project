services:
  user-service:
    build: ./user-service
    environment:
      PORT: 3001
      SERVICE_NAME: user-service
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${USER_PORT:-3001}:3001"
    networks: [appnet]

  product-service:
    build: ./product-service
    environment:
      PORT: 3002
      SERVICE_NAME: product-service
    ports:
      - "${PRODUCT_PORT:-3002}:3002"
    networks: [appnet]

  notification-service:
    build: ./notification-service
    environment:
      PORT: 3004
      SERVICE_NAME: notification-service
    ports:
      - "${NOTIFICATION_PORT:-3004}:3004"
    networks: [appnet]

  order-service:
    build: ./order-service
    environment:
      PORT: 3003
      SERVICE_NAME: order-service
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on: [user-service, product-service, notification-service]
    ports:
      - "${ORDER_PORT:-3003}:3003"
    networks: [appnet]

  frontend:
    build: ./frontend
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on: [user-service, product-service, order-service, notification-service]
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [appnet]

networks:
  appnet:
